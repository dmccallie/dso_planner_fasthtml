[project]
name = "dso_planner_fasthtml"
version = "0.1.0"
description = "Deep Sky Object planner and interactive sky map viewer built with FastHTML and D3.js"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astronomy-engine>=2.1.19",
    "faker>=37.6.0",
    "geopy>=2.4.1",
    "matplotlib>=3.10.6",
    "pillow>=11.3.0",
    "pydantic-ai>=1.59.0",
    "python-fasthtml>=0.12.25",
    "timezonefinder>=8.0.0",
    "uvicorn>=0.35.0",
]
